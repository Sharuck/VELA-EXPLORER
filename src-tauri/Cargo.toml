[package]
name = "vela-explorer"
version = "0.3.0"
description = "Windows-style file explorer for macOS, powered by Rust"
authors = ["Vela Explorer"]
edition = "2021"

[lib]
name = "vela_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
trash = "5"
fs2 = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
